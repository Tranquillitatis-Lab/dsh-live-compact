name: Windows 1.1.4 #38 cold-recovery and long-session verification
on:
  push:
    branches: [validation/114-windows-issue38]
permissions:
  contents: read
jobs:
  long_session:
    if: github.ref == 'refs/heads/validation/114-windows-issue38' && contains(github.event.head_commit.message, '[windows-long]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            arch: arm64
          - runner: windows-2022
            arch: x64
    name: long session (${{ matrix.runner }})
    env:
      DSH_VERIFY_VERSION: '0.2.0-rc.2'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
          architecture: ${{ matrix.arch }}
      - name: Standard-user 29-turn persistent-session replay
        shell: pwsh
        run: ./test/windows-runtime/windows.ps1
      - name: Long-session evidence summary
        if: always()
        shell: pwsh
        run: |
          $path = 'test/windows-runtime/.local/windows-evidence/result.json'
          if (Test-Path -LiteralPath $path) {
            Get-Content -LiteralPath $path -Raw >> $env:GITHUB_STEP_SUMMARY
          } else {
            'NOT_RUN_OR_SETUP_FAILED: no long-session result.json' >> $env:GITHUB_STEP_SUMMARY
          }
          '--- evidence files ---' >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -LiteralPath 'test/windows-runtime/.local/windows-evidence' -File -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name >> $env:GITHUB_STEP_SUMMARY
          foreach ($name in @('standard-user.stdout.log','standard-user.stderr.log','runtime-setup.stderr.log','hard-11k.stdout.log','hard-11k.stderr.log')) {
            $file = Join-Path 'test/windows-runtime/.local/windows-evidence' $name
            if (Test-Path -LiteralPath $file) {
              "--- $name (tail 80) ---" >> $env:GITHUB_STEP_SUMMARY
              Get-Content -LiteralPath $file -Tail 80 >> $env:GITHUB_STEP_SUMMARY
            }
          }
